[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biodesign-research-agents"
version = "0.1.0"
description = "Read-only engineering foundation for the ASU Biodesign research copilot"
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-adk[a2a]==2.12.0",
  "a2a-sdk[http-server]==1.2.3",
  "uvicorn==0.54.0",
  "numpy==2.3.5",
  "matplotlib==3.11.2",
  "pydantic==2.14.1",
  "google-cloud-agentplatform[agent-engines]==2.6.0",
  "google-cloud-storage==3.17.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "psutil==7.2.2", "Flask==3.1.3"]

[project.scripts]
research-coverage-audit = "research_agents.coverage:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
